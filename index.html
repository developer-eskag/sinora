<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>SiNORA</title>

	<!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

	<!-- CSS -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

	<!-- ========================================
					HEADER
	========================================= -->
	<header class="header">
		<div class="container">
			<nav class="navbar">

				<!-- Logo -->
				<a href="#" class="logo">
					<img src="assets/images/logo.png" alt="SiNORA">
				</a>

				<!-- Navigation -->
				<ul class="nav-menu">
					<li><a href="#" class="active">Home</a></li>
					<li><a href="#">About</a></li>
					<li><a href="#">Shop</a></li>
					<li><a href="#">Science</a></li>
					<li><a href="#">Blog</a></li>
					<li><a href="#">Contact</a></li>
				</ul>

				<!-- Right -->
				<div class="nav-right">
					<!-- Search -->
					<button class="icon-btn" aria-label="Search">
						<i data-lucide="search"></i>
					</button>

					<!-- Wishlist -->
					<button class="icon-btn" aria-label="Wishlist">
						<i data-lucide="heart"></i>
					</button>

					<!-- User -->
					<button class="icon-btn" aria-label="Account">
						<i data-lucide="user"></i>
					</button>

					<!-- Cart -->
					<button class="icon-btn cart-btn" aria-label="Cart">
						<i data-lucide="shopping-bag"></i>
						<span class="cart-count">0</span>
					</button>

					<!-- Mobile Toggle -->
	                <button class="menu-toggle">
	                    <span></span>
	                    <span></span>
	                    <span></span>
	                </button>

				</div>
			</nav>
		</div>
	</header>
	<div class="menu-overlay"></div>
	
	<!-- GSAP -->
	<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

	<!-- Swiper -->
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

	<!-- Lucied Icon -->
	<script src="https://unpkg.com/lucide@latest"></script>

	<!-- Main JS -->
	<script src="assets/js/main.js"></script>
</body>
</html>
